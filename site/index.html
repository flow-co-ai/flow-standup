<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flow Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f1f1ee; --card:#ffffff; --ink:#18191a; --muted:#6b6e68; --faint:#9a9d96; --line:#e7e7e2; --soft:#f4f4f1;
  --rail:#1b1c19; --rail-2:#26271f; --rail-ink:#ecede8; --rail-muted:#9c9e96;
  --hero:#1a1b17; --hero-line:#2e3029; --hero-muted:#a9aba3;
  --green:#58701b;        /* Flow green, a step darker */
  --green-on-dark:#a9c04b;/* same hue, lifted so it reads on the dark panel */
  --green-wash:#eef2df;
  --amber:#d99a1e; --red:#c8372d;
  --r-lg:28px; --r-md:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit}
.app{min-height:100vh}

/* ── rail ─────────────────────────────────────────── */
.rail{background:var(--rail);color:var(--rail-ink);padding:32px 22px 24px;position:fixed;top:0;left:0;bottom:0;width:300px;display:flex;flex-direction:column;overflow-y:auto;z-index:5}
.logo{height:42px;width:auto;display:block;margin:0 10px 34px;align-self:flex-start;object-fit:contain}
.rail .lbl{font-size:13px;color:var(--rail-muted);margin:0 12px 8px}
.viewsel{position:relative;margin-bottom:26px}
.viewsel select{appearance:none;-webkit-appearance:none;width:100%;background:var(--rail-2);color:var(--rail-ink);border:1px solid #33352c;border-radius:14px;padding:13px 40px 13px 16px;font:500 16px Inter,sans-serif;cursor:pointer}
.viewsel::after{content:"";position:absolute;right:18px;top:50%;margin-top:-3px;border:5px solid transparent;border-top:6px solid var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;text-decoration:none;color:#d6d7d1;font-size:16.5px}
.nav a:hover{background:var(--rail-2)}
.nav a svg{width:21px;height:21px;flex:0 0 21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a.on{background:#fff;color:var(--ink);font-weight:600}
.nav a.on svg{stroke:var(--green);opacity:1}
.nav a .n{margin-left:auto;font-size:13px;color:var(--amber);font-weight:600}
.nav a.on .n{color:var(--green)}
.nav .sep{height:1px;background:#2c2e26;margin:14px 12px}
.railfoot{margin-top:auto;padding:22px 12px 0;font-size:14px;color:var(--rail-muted)}
.railfoot a,.railfoot button{color:var(--rail-ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.railfoot a:hover,.railfoot button:hover{text-decoration:underline}
.railfoot .live{display:inline-block;margin-top:10px;color:var(--green-on-dark)}
.railfoot input{margin-top:10px;width:100%;background:var(--rail-2);border:1px solid #33352c;border-radius:10px;color:var(--rail-ink);padding:9px 12px;font:inherit}
.railfoot .err{color:#ef8b7f;display:block;margin-top:8px}
.railfoot .upd{margin-top:16px;font-size:13px}

/* ── main ─────────────────────────────────────────── */
.main{padding:36px 56px 72px;min-width:0;max-width:1820px;margin-left:300px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.crumb{font-size:18px;color:var(--muted)} .crumb b{color:var(--ink);font-weight:600}
.range{display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 1px 0 var(--line)}
.range button{border:0;background:none;padding:9px 20px;border-radius:999px;font-size:16px;color:var(--muted);cursor:pointer}
.range button.on{background:var(--ink);color:#fff}

/* hero */
.hero{background:var(--hero);color:#fff;border-radius:var(--r-lg);overflow:hidden;position:relative}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 92% 0%,rgba(88,112,27,.42),rgba(88,112,27,0) 70%);pointer-events:none}
.hero-in{position:relative;padding:48px 52px 34px}
.hero h1{font:700 52px/1.08 "Inter Tight",Inter,sans-serif;letter-spacing:-.035em;margin:0;max-width:17em}
.hero h1 em{font-style:normal;color:var(--green-on-dark)}
.bul{list-style:none;margin:26px 0 0;padding:0}
.bul li{display:flex;gap:14px;align-items:baseline;font-size:19px;line-height:1.45;color:#e6e7e2;padding:3px 0}
.bul li::before{content:"";flex:0 0 10px;height:10px;border-radius:50%;background:var(--amber);transform:translateY(-1px)}
.bul li.bad::before{background:var(--red)} .bul li.ok::before{background:var(--green-on-dark)} .bul li.info::before{background:#6f7268}
.strip{position:relative;display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));border-top:1px solid var(--hero-line)}
.k{padding:24px 0 22px 28px;border-left:1px solid var(--hero-line)}
.k:first-child{border-left:0;padding-left:52px}
.k .l{font-size:15px;color:var(--hero-muted)}
.k .v{font:700 38px/1.15 "Inter Tight",Inter,sans-serif;letter-spacing:-.02em;margin-top:6px}
.k .p{font-size:14.5px;color:var(--hero-muted);margin-top:4px;min-height:22px}
.k .p b{font-weight:500} .k .p b.up{color:var(--green-on-dark)} .k .p b.down{color:var(--amber)}
.k svg{display:block;margin-top:12px;width:82%;height:34px}

/* cards */
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-top:28px}
.grid.even{grid-template-columns:1fr 1fr}
.grid.one{grid-template-columns:1fr}
.card{background:var(--card);border-radius:var(--r-lg);padding:32px 36px 30px;min-width:0}
.card h2{font:700 23px/1.25 "Inter Tight",Inter,sans-serif;letter-spacing:-.015em;margin:0}
.card .sub{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.card .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.chip{background:var(--soft);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
.card .body{margin-top:20px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.tile{background:var(--soft);border-radius:var(--r-md);padding:16px 18px}
.tile .l{font-size:14px;color:var(--muted)} .tile .v{font:700 28px/1.2 "Inter Tight",Inter,sans-serif;margin-top:4px}

/* bars (like the win-back card) */
.bars{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;gap:16px 18px;align-items:center;font-size:16.5px}
.bars .track{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.bars .fill{height:100%;background:#c9cbc2;border-radius:999px}
.bars .fill.hot{background:var(--green)}
.bars .val{font-weight:700;text-align:right}

/* rows */
.rows{margin-top:10px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 128px 140px 80px;gap:16px;align-items:baseline;padding:13px 6px;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px}
.rows.nc .row{grid-template-columns:minmax(0,1fr) 128px 140px 80px}
.rows .row:last-child{border-bottom:0}
a.row:hover{background:var(--soft);border-radius:10px}
.row .client{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name{font-weight:500}
.row .state{font-size:14px;color:var(--muted)}
.row .state.stuck{color:var(--red);font-weight:600}
.row .state.quiet,.row .state.overdue{color:#a8700b;font-weight:600}
.row .who{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who.none{color:var(--faint);font-style:italic}
.row .age{text-align:right}
.row .age.old{color:#a8700b;font-weight:600}
.rows.compact .row{grid-template-columns:minmax(0,1fr) auto;gap:2px 14px}
.rows.compact .row .name{grid-column:1;order:1} .rows.compact .row .age{grid-column:2;order:2}
.rows.compact .row .state{grid-column:1;order:3;font-size:13px} .rows.compact .row .who{grid-column:2;order:4;text-align:right;font-size:13px}
.lane{font-size:14px;font-weight:600;color:var(--muted);margin:22px 6px 0}
.lane:first-child{margin-top:4px}
.empty{color:var(--muted);padding:14px 6px}

/* tables */
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%}
th{font-size:14px;font-weight:500;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:bottom;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:6px}
td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.c{cursor:pointer} tr.c:hover td{background:var(--soft)}
tr.c td:first-child{font-weight:600}
td .s{display:block;font-size:13px;color:var(--faint);margin-top:2px}
td.zero{color:var(--faint)} td.hot{color:#a8700b;font-weight:600} td.na{color:var(--faint);font-size:14px}
.clients{min-width:980px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.note{font-size:14px;color:var(--muted);margin-top:14px}
.legend{display:flex;gap:18px;font-size:14.5px;margin-top:12px;color:var(--ink)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink);margin-right:8px}
.legend span.g::before{background:#c9cbc2}
.connect p{margin:0 0 10px;font-size:16px;max-width:42em}
details{margin-top:14px} summary{cursor:pointer;font-weight:500}
details ul{margin:10px 0 0;padding-left:20px} details li{margin:4px 0}
.rules li{margin:6px 0;color:var(--ink)}

:focus-visible{outline:2px solid var(--green);outline-offset:2px}

@media (max-width:1180px){ .grid,.grid.even{grid-template-columns:1fr} .strip{--cols:3 !important} .k:nth-child(3n+1){border-left:0;padding-left:52px} .k:nth-child(n+4){border-top:1px solid var(--hero-line)} }
@media (max-width:860px){
  .app{display:block}
  .rail{position:static;width:auto;height:auto;padding:16px 16px 12px}
  .logo{height:24px;margin:0 4px 14px}
  .rail .lbl{display:none} .viewsel{margin-bottom:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav a{flex:0 0 auto;padding:8px 14px;font-size:15px}
  .nav a svg{display:none} .nav .sep{display:none}
  .railfoot{padding:12px 4px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
  .railfoot .upd,.railfoot .live{margin-top:0}
  .main{padding:18px 14px 48px;margin-left:0}
  .top{margin-bottom:16px} .crumb{font-size:16px}
  .range button{padding:7px 11px;font-size:13.5px}
  .hero-in{padding:28px 22px 22px}
  .hero h1{font-size:31px}
  .bul li{font-size:16px}
  .strip{--cols:2 !important}
  .k,.k:first-child,.k:nth-child(3n+1){padding:18px 0 16px 22px;border-left:1px solid var(--hero-line)}
  .k:nth-child(2n+1){border-left:0}
  .k:nth-child(n+3){border-top:1px solid var(--hero-line)}
  .k .v{font-size:28px}
  .card{padding:22px 18px;border-radius:22px}
  .tiles{grid-template-columns:1fr 1fr}
  .row,.rows.nc .row{grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:12px 2px}
  .row .client{grid-column:1/-1;order:0;font-size:13px}
  .row .name{grid-column:1/3;order:1} .row .age{grid-column:3;order:2}
  .row .state{grid-column:1;order:3} .row .who{grid-column:2/-1;order:4}
  .clients{min-width:0} .clients thead{display:none}
  .clients tr.c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;padding:14px 2px;border-bottom:1px solid var(--line)}
  .clients tr.c td{display:block;border:0;padding:0;text-align:left}
  .clients tr.c td:first-child{grid-column:1/-1;font-size:16px}
  .clients tr.c td[colspan]{grid-column:1/-1}
  .clients tr.c td[data-label]::before{content:attr(data-label);display:block;font-size:12px;font-weight:400;color:var(--faint)}
  .bars{grid-template-columns:minmax(90px,auto) 1fr auto;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.steps{list-style:none;margin:4px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:3px 16px;padding:17px 0;border-bottom:1px solid var(--line);align-items:start}
.steps li:last-child{border-bottom:0}
.steps .no{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px Inter,sans-serif;background:var(--green-wash);color:var(--green)}
.steps .no.p0{background:#fbe6e3;color:var(--red)} .steps .no.p1{background:#fbf0d8;color:#a8700b}
.steps .a{font-weight:600;font-size:17px;line-height:1.35}
.steps .w{grid-column:2;color:var(--muted);font-size:15px}
.steps .side{grid-row:1/3;grid-column:3;display:flex;align-items:center;gap:10px;padding-top:2px}
.copy{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink);cursor:pointer}
.copy:hover{border-color:var(--green);color:var(--green)}
@media (max-width:860px){ .steps li{grid-template-columns:34px minmax(0,1fr)} .steps .side{grid-row:auto;grid-column:2;padding-top:8px} }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <img class="logo" src="assets/flowco-logo-light.png" alt="Flow Co">
    <div class="lbl">Client</div>
    <div class="viewsel"><select id="view" aria-label="Client"></select></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="railfoot" id="railfoot"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="crumb" id="crumb"></div>
      <div class="range" id="range" role="group" aria-label="Date range"></div>
    </div>
    <div id="view-body"></div>
  </main>
</div>

<script>
(() => {
  "use strict";
  const PASS_KEY = "flowops-passcode", LAST_KEY = "flowops-client";
  const DAY = 86400000;
  const LANES = ["CRM", "Ads", "Video", "Web + SEO"];
  const ICON = {
    overview: '<polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/>',
    paid: '<path d="M4 10v4h3l6 4V6L7 10H4z"/><path d="M17 9a4 4 0 0 1 0 6"/>',
    organic: '<circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/>',
    crm: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5c2 .8 3 2.8 3 5.5"/>',
    drafts: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><line x1="13.5" y1="6.5" x2="17.5" y2="10.5"/>',
  };
  const TABS = [["overview", "Overview"], ["paid", "Paid"], ["organic", "Organic"], ["crm", "CRM"]];
  const S = { snapshot: null, live: null, ops: null, hub: null, quietDays: 14, quietOngoing: 30, recentDays: 30, liveError: "", askPass: false, n: 7 };

  // ── helpers ────────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = new Date(); today.setHours(0, 0, 0, 0);
  function toDate(v) {
    if (!v) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); }
    const d = new Date(v); return isNaN(d) ? null : d;
  }
  const dayOf = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const daysSince = (d) => d ? Math.max(0, Math.round((today - dayOf(d)) / DAY)) : null;
  const fmtDay = (d) => d ? d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
  const fmtTime = (d) => d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const money = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const moneyK = (n) => Math.abs(n) >= 10000 ? "$" + (n / 1000).toFixed(1) + "K" : money(n);
  const num = (n) => Math.round(n).toLocaleString("en-US");
  const plural = (n, one, many) => `${num(n)} ${Math.round(n) === 1 ? one : many}`;
  const ageText = (n) => n == null ? "—" : n === 0 ? "today" : plural(n, "day", "days");
  const sum = (a) => a.reduce((x, y) => x + (+y || 0), 0);
  const cap = (t) => t.replace(/^./, (x) => x.toUpperCase());
  function firstNames(people) {
    if (!people) return "";
    const names = people.split(",").map((p) => {
      const t = p.trim(), parts = t.split(/\s+/);
      if (/team$/i.test(t)) return t;
      if (/^(muhammad|mohammed|mohammad)$/i.test(parts[0]) && parts.length > 1) return parts[1];
      return parts[0];
    }).filter(Boolean);
    return [...new Set(names)].join(", ");
  }

  // ── Monday items (only activity within the last recentDays) ────────────
  function bucket(status) {
    const s = (status || "").trim().toLowerCase();
    if (!s) return "blank";
    if (s === "done") return "done";
    if (s === "start" || s === "not yet") return "notStarted";
    if (s.includes("review")) return "review";
    if (s === "stuck") return "stuck";
    if (s === "reopened") return "reopened";
    if (s === "waiting" || s === "contingent") return "waiting";
    return "active";
  }
  function normalize(payload) {
    const out = [];
    for (const [client, list] of Object.entries((payload && payload.by_client) || {})) {
      for (const it of list || []) {
        const stamps = [it.item_updated_at, it.updated_at, it.last_activity, it.created_at].map(toDate).filter(Boolean);
        const activity = stamps.length ? new Date(Math.max(...stamps)) : null;
        const b = bucket(it.status), due = toDate(it.due);
        out.push({ id: it.monday_item_id, name: it.name, url: it.monday_url, client, lane: it.board,
          status: it.status || "", bucket: b, people: it.people || "", who: firstNames(it.people),
          activity, days: daysSince(activity), due, overdue: !!(due && due < today && b !== "done") });
      }
    }
    return out;
  }
  const recent = (it) => it.days != null && it.days <= S.recentDays;
  const quietLimit = (it) => /^ongoing$/i.test(it.status) ? S.quietOngoing : S.quietDays;
  function stall(it) {
    if (it.bucket === "stuck") return ["Stuck", "stuck"];
    if (it.overdue) return [`Was due ${fmtDay(it.due)}`, "overdue"];
    if (it.bucket === "reopened") return ["Reopened", "stuck"];
    if (it.bucket === "waiting") return [it.status, ""];
    if (it.bucket === "active" && it.days >= quietLimit(it)) return ["No update", "quiet"];
    return null;
  }
  const byAge = (a, b) => (b.days ?? 0) - (a.days ?? 0);
  function rowHTML(it, o = {}) {
    const [label, cls] = o.reason || [it.status || "No status", ""];
    return `<a class="row" href="${esc(it.url)}" target="_blank" rel="noopener" title="Open in Monday">
      <span class="name">${esc(it.name)}</span><span class="state ${cls}">${esc(o.lane ? it.lane : label)}</span>
      <span class="who ${it.who ? "" : "none"}">${esc(it.who || "No owner")}</span>
      <span class="age ${o.old ? "old" : ""}">${ageText(it.days)}</span></a>`;
  }
  const rowsHTML = (list, o, empty) => `<div class="rows nc compact">${list.length
    ? list.map((it) => rowHTML(it, typeof o === "function" ? o(it) : o)).join("") : `<div class="empty">${esc(empty)}</div>`}</div>`;
  function shippedFor(name, items, days) {
    const events = (S.live && Array.isArray(S.live.shipped) ? S.live.shipped : (S.ops && S.ops.shipped)) || [];
    const byId = new Map(items.map((i) => [String(i.id), i]));
    return events.map((e) => { const it = byId.get(String(e.monday_item_id)), d = toDate(e.date);
      return { name: e.name, date: d, days: daysSince(d), client: it ? it.client : e.client, url: it ? it.url : "", lane: it ? it.lane : "", who: it ? it.who : "" }; })
      .filter((e) => e.client === name && e.days != null && e.days < days);
  }

  // ── hub numbers: lag-aware windows of S.n days ─────────────────────────
  const hubClient = (name) => (S.hub && S.hub.clients && S.hub.clients[name]) || null;
  function windowOf(c, key) {
    const n = S.n, dates = c.dates || [];
    const end = (S.hub.complete_through || {})[key] || dates[dates.length - 1];
    let e = dates.lastIndexOf(end); if (e < 0) e = dates.length - 1;
    const arr = (c.series && c.series[key]) || [];
    const cur = sum(arr.slice(Math.max(0, e - n + 1), e + 1));
    const prev = e >= 2 * n - 1 ? sum(arr.slice(e - 2 * n + 1, e - n + 1)) : null;
    return { cur, prev, end: dates[e], e, short: e + 1 < n, have: e + 1 };
  }
  function delta(cur, prev, goodWhenUp = true, plain = false) {
    const span = `the ${S.n} days before`;
    if (prev == null) return "";
    if (!prev && !cur) return `same as ${span}`;
    if (!prev) return `none ${span}`;
    const pct = Math.round(((cur - prev) / prev) * 100);
    if (Math.abs(pct) < 5) return `about the same as ${span}`;
    const up = pct > 0;
    return plain ? `${up ? "up" : "down"} ${Math.abs(pct)}% vs ${span}` : `<b class="${up === goodWhenUp ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(pct)}%</b> vs ${span}`;
  }
  function spark(values, endIdx) {
    const w = 200, h = 34, n = values.length; if (n < 2) return "";
    const max = Math.max(...values, 1);
    const P = values.map((v, i) => [(i / (n - 1)) * w, h - 3 - (v / max) * (h - 6)]);
    const done = P.slice(0, endIdx + 1), tail = P.slice(endIdx);
    const line = done.map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ");
    const area = `M0,${h} L${line.replace(/ /g, " L")} L${done[done.length - 1][0].toFixed(1)},${h} Z`;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${area}" fill="rgba(169,192,75,.16)"/>
      <polyline points="${line}" fill="none" stroke="#a9c04b" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      ${tail.length > 1 ? `<polyline points="${tail.map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#6f7268" stroke-width="1.4" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ""}</svg>`;
  }
  const k = (l, v, p, sp) => `<div class="k"><div class="l">${esc(l)}</div><div class="v">${v}</div><div class="p">${p || ""}</div>${sp || ""}</div>`;
  const hero = (h1, bullets, kpis) => `<section class="hero"><div class="hero-in"><h1>${h1}</h1>${bullets.length ? `<ul class="bul">${bullets.slice(0, 4).map(([t, x]) => `<li class="${t}">${x}</li>`).join("")}</ul>` : ""}</div>
      ${kpis.length ? `<div class="strip" style="--cols:${kpis.length}">${kpis.join("")}</div>` : ""}</section>`;
  const card = (title, sub, body, chip) => `<section class="card"><div class="hdr"><div><h2>${esc(title)}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${chip ? `<span class="chip">${esc(chip)}</span>` : ""}</div><div class="body">${body}</div></section>`;
  function areaChart(cFull, key, fmt) {
    const keep = span(cFull), all = (cFull.series && cFull.series[key]) || [];
    let c = { dates: cFull.dates.slice(-keep) }, vals = all.slice(-keep), n = vals.length;
    if (n < 2) return `<div class="empty">No data.</div>`;
    const end = (S.hub.complete_through || {})[key] || c.dates[n - 1];
    let e = c.dates.lastIndexOf(end); if (e < 0) e = n - 1;
    let weekly = false;
    if (S.n >= 30) { // 30 and 90 days read better as weekly totals, ending on the last fully reported day
      const wd = [], wv = [];
      for (let j = e; j - 6 >= 0; j -= 7) { wd.unshift(c.dates[j - 6]); wv.unshift(sum(vals.slice(j - 6, j + 1))); }
      if (wv.length >= 2) { c = { dates: wd }; vals = wv; n = wv.length; e = n - 1; weekly = true; }
    }
    const W = 620, H = 270, L = 50, R = 58, T = 12, B = 30, iw = W - L - R, ih = H - T - B, max = Math.max(...vals, 1) * 1.08;
    const X = (i) => L + (i / (n - 1)) * iw, Y = (v) => T + ih - (v / max) * ih;
    const pts = vals.map((v, i) => [X(i), Y(v)]);
    const line = pts.slice(0, e + 1).map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ");
    const area = `M${X(0)},${T + ih} L${line.replace(/ /g, " L")} L${X(e).toFixed(1)},${T + ih} Z`;
    const ticks = [0, 1 / 3, 2 / 3, 1].map((f) => { const v = (max / 1.08) * f, y = Y(v);
      return `<line x1="${L}" x2="${L + iw}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ecece7"/><text x="${L - 10}" y="${(y + 4).toFixed(1)}" font-size="13" fill="#9a9d96" text-anchor="end">${esc(fmt(v))}</text>`; }).join("");
    const s0 = Math.max(0, e - (weekly ? Math.round(S.n / 7) : S.n) + 1);
    const tail = e < n - 1 ? `<polyline points="${pts.slice(e).map((p) => p.map((x) => x.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="#b9bbb3" stroke-width="2" stroke-dasharray="5 5"/>` : "";
    const lbl = [0, Math.floor((n - 1) / 2), n - 1].map((i) => `<text x="${X(i).toFixed(1)}" y="${H - 8}" font-size="13" fill="#9a9d96" text-anchor="middle">${esc(fmtDay(toDate(c.dates[i])))}</text>`).join("");
    const hits = vals.map((v, i) => `<rect x="${(X(i) - iw / (2 * (n - 1))).toFixed(1)}" y="${T}" width="${(iw / (n - 1)).toFixed(1)}" height="${ih}" fill="transparent"><title>${weekly ? "Week of " : ""}${esc(fmtDay(toDate(c.dates[i])))}: ${esc(i > e ? "not reported yet" : fmt(v))}</title></rect>`).join("");
    const last = pts[e];
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="By day"><defs><linearGradient id="g-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58701b" stop-opacity=".22"/><stop offset="1" stop-color="#58701b" stop-opacity="0"/></linearGradient></defs>
      ${ticks}<rect x="${X(s0).toFixed(1)}" y="${T}" width="${(X(e) - X(s0)).toFixed(1)}" height="${ih}" fill="#58701b" opacity=".06"/><path d="${area}" fill="url(#g-${key})"/>
      <polyline points="${line}" fill="none" stroke="#58701b" stroke-width="2.4" stroke-linejoin="round"/>${tail}
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5" fill="#fff" stroke="#58701b" stroke-width="2.4"/>
      <text x="${(last[0] + 10).toFixed(1)}" y="${(last[1] + 5).toFixed(1)}" font-size="14" font-weight="600" fill="#58701b">${esc(fmt(vals[e]))}</text>${lbl}${hits}</svg></div>`;
  }
  const longHist = (c) => c && (c.dates || []).length > 28;
  const shortNote = (c) => c && windowOf(c, "spend").short ? [["info", `Only ${windowOf(c, "spend").have} days of history so far. The ${S.n}-day view fills in after the next daily run.`]] : [];
  function chan(c) {
    if (!longHist(c)) return { ...c.channels, label: "28 days" };
    const w = (k) => windowOf(c, k).cur;
    return { meta: { spend: w("meta_spend"), leads: w("meta_leads"), clicks: w("meta_clicks") },
      google_ads: { spend: w("google_spend"), conversions: w("google_conversions"), clicks: w("google_clicks") }, label: `${S.n} days` };
  }
  function profs(c) {
    if (!(c.profiles_daily || []).length) return { list: c.profiles || [], label: "28 days" };
    const w = windowOf(c, "gbp_actions"), a = Math.max(0, w.e - S.n + 1), b = w.e + 1;
    return { list: c.profiles_daily.map((p) => ({ label: p.label, calls: sum(p.calls.slice(a, b)), directions: sum(p.directions.slice(a, b)),
      web_clicks: sum(p.web_clicks.slice(a, b)), impressions: sum(p.impressions.slice(a, b)) })), label: `${S.n} days through ${fmtDay(toDate(w.end))}` };
  }
  const daysLbl = (w) => (w && w.short ? w.have : S.n);
  const per = () => (S.n >= 30 ? "by week" : "by day");
  const span = (c) => Math.min((c.dates || []).length, Math.max(28, 2 * S.n));
  function barsHTML(rows) {
    const max = Math.max(...rows.map((r) => r[1] || 0), 1);
    return `<div class="bars">${rows.map(([l, v, hot]) => `<div>${esc(l)}</div><div class="track"><div class="fill ${hot ? "hot" : ""}" style="width:${Math.max(1, (100 * (v || 0)) / max).toFixed(1)}%"></div></div><div class="val">${num(v || 0)}</div>`).join("")}</div>`;
  }

  // ── models ─────────────────────────────────────────────────────────────
  function paidModel(c) {
    if (!c || !(c.dates || []).length) return null;
    const sales = c.kind === "sales";
    const sp = windowOf(c, "spend"), rs = windowOf(c, sales ? "purchases" : "leads"), rv = windowOf(c, "revenue");
    let lastSpend = null; for (let i = c.dates.length - 1; i >= 0; i--) if (c.series.spend[i] > 0) { lastSpend = c.dates[i]; break; }
    return { sales, sp, rs, rv, has: sum(c.series.spend) > 0, lastSpend };
  }
  const ORG = [["gbp_actions", "Google profile actions", "google_my_business", "Google Business Profile"], ["sc_clicks", "Search clicks", "searchconsole", "Search Console"], ["ga4_sessions", "Website sessions", "googleanalytics4", "Google Analytics"], ["ig_reach", "Instagram reach", "instagram", "Instagram"]];
  const poss = (n) => /s$/i.test(n) ? `${n}'` : `${n}'s`;
  function mondayModel(name, items) {
    const mine = items.filter((i) => i.client === name && recent(i));
    return { mine, review: mine.filter((i) => i.bucket === "review").sort(byAge), stalled: mine.filter((i) => stall(i) && i.bucket !== "review").sort(byAge),
      moving: mine.filter((i) => i.bucket === "active" && !stall(i)).sort((a, b) => a.days - b.days),
      shipped: shippedFor(name, items, S.recentDays), lastActive: Math.min(...mine.map((i) => i.days), 999) };
  }

  // ── next steps: fixed rules, each tied to a number ─────────────────────
  // step: { area: overview|paid|organic|crm, lane, pri: 0 urgent / 1 this week / 2 opportunity, a: action, w: why }
  function nextSteps(name, c, items) {
    const out = [], add = (area, lane, pri, a, w) => out.push({ area, lane, pri, a, w });
    const m = c ? paidModel(c) : null;
    if (m && m.has) {
      const ch = chan(c), g = ch.google_ads, mt = ch.meta, top = c.top_campaign;
      if (m.sp.cur === 0) add("paid", "Ads", 0, `Confirm whether ${poss(name)} ads were paused on purpose`, `No ad spend in Windsor since ${fmtDay(toDate(m.lastSpend))}. If it wasn't planned, restart; if it was, say so on the next call.`);
      else if (m.rs.cur === 0) add("paid", "Ads", 0, `Check the lead forms and tracking${top ? ` on ${top.name}` : ""}`, `${money(m.sp.cur)} spent in ${daysLbl(m.sp)} days with no ${m.sales ? "sales" : "leads"} reported.`);
      if (g.spend > 0 && !g.conversions) add("paid", "Ads", 0, "Check Google Ads conversion tracking, then the search terms report", `${money(g.spend)} spent in ${ch.label} with no conversions recorded.`);
      else if (g.spend > 0 && g.conversions && mt.leads && g.spend / g.conversions > 3 * (mt.spend / mt.leads))
        add("paid", "Ads", 1, "Tighten Google search terms, or move part of the Google budget to Meta", `Google costs ${money(g.spend / g.conversions)} per conversion; Meta costs ${money(mt.spend / mt.leads)} per lead (${ch.label}).`);
      if (!m.sales && m.sp.prev && m.rs.cur && m.rs.prev) {
        const cpl = m.sp.cur / m.rs.cur, p = m.sp.prev / m.rs.prev;
        if (cpl > p * 1.5) add("paid", "Ads", 1, `Refresh the creative${top ? ` on ${top.name}` : ""}`, `Cost per lead rose from ${money(p)} to ${money(cpl)} in ${daysLbl(m.sp)} days.`);
        if (cpl < p * 0.67) add("paid", "Account", 2, `Send ${name} the win`, `Cost per lead fell from ${money(p)} to ${money(cpl)} in ${daysLbl(m.sp)} days.`);
      }
      if (m.sales && m.sp.cur && m.sp.prev) {
        const r = m.rv.cur / m.sp.cur, rp = m.rv.prev / m.sp.prev;
        if (r < rp * 0.7) add("paid", "Ads", 1, `Look at what changed${top ? ` on ${top.name}` : ""}`, `Return on ad spend fell from ${rp.toFixed(1)}× to ${r.toFixed(1)}×.`);
        if (r > rp * 1.3) add("paid", "Account", 2, `Send ${name} the win`, `Return on ad spend rose from ${rp.toFixed(1)}× to ${r.toFixed(1)}×, ${money(m.rv.cur)} in sales.`);
      }
      const spend28 = sum(c.series.spend);
      if (top && spend28 && top.spend / spend28 > 0.8 && m.sp.cur > 0) add("paid", "Ads", 2, "Launch a second campaign or ad set to test against the main one", `${top.name} carries ${Math.round((100 * top.spend) / spend28)}% of spend.`);
    }
    if (c) {
      for (const [key, label, src, product] of ORG) {
        if ((c.sources || []).includes(src) && sum(c.series[key] || []) === 0) add("organic", "Web + SEO", 1, `Check the ${product} connection in Windsor`, `It's connected but reported no ${label.toLowerCase()} in ${c.dates.length} days.`);
      }
      const gb = windowOf(c, "gbp_actions"), sc = windowOf(c, "sc_clicks");
      if (gb.prev >= 20 && gb.cur < gb.prev * 0.7) add("organic", "Web + SEO", 1, "Post to the Google profile this week and check it for edits or suspensions", `Profile actions down ${Math.round(100 - (100 * gb.cur) / gb.prev)}% (${num(gb.prev)} to ${num(gb.cur)}) through ${fmtDay(toDate(gb.end))}.`);
      if (gb.prev >= 20 && gb.cur > gb.prev * 1.3) add("organic", "Account", 2, `Send ${name} the Google profile win`, `Profile actions up ${Math.round((100 * gb.cur) / gb.prev - 100)}% (${num(gb.prev)} to ${num(gb.cur)}).`);
      if (sc.prev >= 20 && sc.cur < sc.prev * 0.7) add("organic", "Web + SEO", 2, "Find which pages lost Google clicks in Search Console", `Search clicks down ${Math.round(100 - (100 * sc.cur) / sc.prev)}% (${num(sc.prev)} to ${num(sc.cur)}) through ${fmtDay(toDate(sc.end))}.`);
      const pf = profs(c);
      for (const p of pf.list) if ((p.impressions || 0) > 50 && !(p.calls || p.directions || p.web_clicks))
        add("organic", "Web + SEO", 1, `Fill in the ${p.label} profile: phone, website, hours and photos`, `Seen ${num(p.impressions)} times in ${pf.label} with no calls, directions or clicks.`);
      const g = c.crm;
      if (!g) add("crm", "CRM", 2, `Connect ${poss(name)} GHL to this page`, "Without it, lead follow-up and wins can't be checked here.");
      else {
        if (c.windsor_leads_28d && g.contacts < c.windsor_leads_28d * 0.8) add("crm", "CRM", 0, "Check that ad leads are reaching GHL", `Ads reported ${num(c.windsor_leads_28d)} leads; GHL added ${num(g.contacts)} contacts (28 days).`);
        if (g.opps_created > 0 && !g.opps_won) add("crm", "CRM", 1, `Get wins marked in GHL${c.system ? `, or synced from ${c.system.name}` : ""}`, `${num(g.opps_created)} opportunities in 28 days, none marked won. Without wins, ROI can't be shown.`);
        if (c.windsor_leads_28d && g.contacts > 3 * c.windsor_leads_28d) add("crm", "CRM", 2, "Tag contact sources in GHL so imports don't count as leads", `GHL added ${num(g.contacts)} contacts vs ${num(c.windsor_leads_28d)} ad leads.`);
      }

    const mm = mondayModel(name, items);
    for (const it of mm.stalled.filter((i) => i.bucket === "stuck" || i.bucket === "reopened").slice(0, 2))
      add("overview", it.lane, 0, `Unblock "${it.name}"`, `${it.status}, last update ${ageText(it.days)} ago${it.who ? `. ${it.who}` : ""}.`);
    for (const it of mm.review.filter((i) => i.days >= 5).slice(0, 2)) add("overview", it.lane, 1, `Review "${it.name}"`, `Waiting on review ${ageText(it.days)}${it.who ? `. ${it.who}` : ""}.`);

  function stepsHTML(steps, name) {
    if (!steps.length) return `<div class="empty">Nothing flagged. The numbers here look steady.</div>`;
    return `<ol class="steps">${steps.map((s, i) => `<li><span class="no p${s.pri}">${i + 1}</span><div class="a">${esc(s.a)}</div><div class="w">${esc(s.w)}</div>
      <div class="side"><span class="chip">${esc(s.lane)}</span><button type="button" class="copy" data-copy="${esc(`${name}: ${s.a}. ${s.w}`)}">Copy</button></div></li>`).join("")}</ol>`;
  }
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("button.copy"); if (!b) return;

    catch { const t = document.createElement("textarea"); t.value = b.dataset.copy; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500);
  });

  // ── views ──────────────────────────────────────────────────────────────
  function overviewView(name, c, items) {
    const m = c ? paidModel(c) : null, mm = mondayModel(name, items), steps = nextSteps(name, c, items);
    const unit = m && m.sales ? ["sale", "sales"] : ["lead", "leads"];
    const h1 = m && m.has
      ? (m.sp.cur ? `<em>${money(m.sp.cur)}</em> in ads brought ${plural(m.rs.cur, ...unit)} in ${daysLbl(m.sp)} days.` : `No ad spend since <em>${esc(fmtDay(toDate(m.lastSpend)))}</em>.`)
      : `<em>${plural(steps.length, "next step", "next steps")}</em> for ${esc(name)} this week.`;
    const facts = [];
    if (m && m.has && m.sp.cur) facts.push(["info", `${m.sales ? "Sales" : "Leads"} ${delta(m.rs.cur, m.rs.prev, true, true) || "steady"}${!m.sales && m.rs.cur ? `, at ${money(m.sp.cur / m.rs.cur)} each` : ""}.`]);
    if (c && sum(c.series.gbp_actions)) { const g = windowOf(c, "gbp_actions"); facts.push(["info", `Google profile actions ${delta(g.cur, g.prev, true, true) || "steady"}, through ${fmtDay(toDate(g.end))}.`]); }
    if (c && c.crm) facts.push(["info", `GHL: ${plural(c.crm.contacts, "new contact", "new contacts")}, ${plural(c.crm.opps_created, "opportunity", "opportunities")}, ${num(c.crm.opps_won || 0)} won in 28 days.`]);
    facts.push(["info", `Monday, last ${S.recentDays} days: ${plural(mm.mine.length, "item", "items")} touched, ${num(mm.shipped.length)} shipped, ${num(mm.review.length)} in review.`]);
    const g = c ? windowOf(c, "gbp_actions") : null;
    const kp = [
      m && m.has ? k(`Ad spend, ${daysLbl(m.sp)} days`, moneyK(m.sp.cur), delta(m.sp.cur, m.sp.prev).replace(/class="(up|down)"/, ""), spark(c.series.spend, m.sp.e)) : k("Ad spend", "—", "No paid ads in Windsor"),
      m && m.has ? k(m.sales ? "Sales" : "Leads", num(m.rs.cur), delta(m.rs.cur, m.rs.prev), spark(c.series[m.sales ? "purchases" : "leads"], m.rs.e)) : k("Leads", "—", ""),
      m && m.has ? k(m.sales ? "Return on spend" : "Cost per lead", m.sales ? (m.sp.cur ? `${(m.rv.cur / m.sp.cur).toFixed(1)}×` : "—") : (m.rs.cur ? money(m.sp.cur / m.rs.cur) : "—"),
        m.sales ? (m.sp.prev ? `was ${(m.rv.prev / m.sp.prev).toFixed(1)}×` : "") : (m.rs.prev ? `was ${money(m.sp.prev / m.rs.prev)}` : "")) : k("Cost per lead", "—", ""),
      c ? k("Google profile actions", num(g.cur), delta(g.cur, g.prev), spark(c.series.gbp_actions, g.e)) : k("Google profile actions", "—", ""),

      (mm.stalled.length ? `<div class="lane">Stalled, ${mm.stalled.length}</div>` + rowsHTML(mm.stalled, (it) => ({ reason: stall(it), old: true }), "") : "") +
      (mm.moving.length ? `<div class="lane">Moving, ${mm.moving.length}</div>` + rowsHTML(mm.moving, {}, "") : "") +
      (mm.shipped.length ? `<div class="lane">Shipped, ${mm.shipped.length}</div><div class="rows nc compact">${mm.shipped.map((e) => `<${e.url ? `a href="${esc(e.url)}" target="_blank" rel="noopener"` : "div"} class="row"><span class="name">${esc(e.name)}</span><span class="state">${esc(e.lane)}</span><span class="who">${esc(e.who)}</span><span class="age">${esc(fmtDay(e.date))}</span></${e.url ? "a" : "div"}>`).join("")}</div>` : "") ||
      `<div class="empty">No Monday activity for ${esc(name)} in ${S.recentDays} days.</div>`, "Monday");
    const chart = m && m.has ? card(`Ad spend ${per()}`, `Last ${span(c)} days. Shaded: the ${S.n} days above.`, areaChart(c, "spend", moneyK), "Windsor")
      : c ? card(`Google profile actions ${per()}`, `Last ${span(c)} days. Dashed: not reported yet.`, areaChart(c, "gbp_actions", num), "Windsor") : "";
    return hero(h1, [...shortNote(c), ...facts], kp) +
      `<div class="grid one">${card("Next steps", "From the numbers on this page, most urgent first. Copy one into Monday or WhatsApp.", stepsHTML(steps.slice(0, 7), name), `${steps.length}`)}</div>
       <div class="grid">${monday}${chart}</div>`;
  }
  function paidView(name, c, items) {
    const m = paidModel(c), steps = nextSteps(name, c, items).filter((s) => s.area === "paid");
    if (!m || !m.has) return hero(`No paid ads in Windsor for <em>${esc(name)}</em>.`, [["info", "LSA and anything billed outside Windsor wouldn't show here."]], []);
    const unit = m.sales ? ["sale", "sales"] : ["lead", "leads"];
    const h1 = m.sp.cur === 0 ? `No ad spend since <em>${esc(fmtDay(toDate(m.lastSpend)))}</em>.`
      : `<em>${money(m.sp.cur)}</em> spent for ${plural(m.rs.cur, ...unit)}${m.sales ? `, ${money(m.rv.cur)} in sales` : m.rs.cur ? ` at ${money(m.sp.cur / m.rs.cur)} each` : ""}.`;
    const meta = windowOf(c, "meta_spend").cur, goog = windowOf(c, "google_spend").cur;
    const kp = [
      k(`Ad spend, ${daysLbl(m.sp)} days`, moneyK(m.sp.cur), delta(m.sp.cur, m.sp.prev).replace(/class="(up|down)"/, ""), spark(c.series.spend, m.sp.e)),
      k(m.sales ? "Sales" : "Leads", num(m.rs.cur), delta(m.rs.cur, m.rs.prev), spark(c.series[m.sales ? "purchases" : "leads"], m.rs.e)),
      k(m.sales ? "Return on spend" : "Cost per lead", m.sales ? (m.sp.cur ? `${(m.rv.cur / m.sp.cur).toFixed(1)}×` : "—") : (m.rs.cur ? money(m.sp.cur / m.rs.cur) : "—"),
        m.sales ? (m.sp.prev ? `was ${(m.rv.prev / m.sp.prev).toFixed(1)}×` : "") : (m.rs.prev ? `was ${money(m.sp.prev / m.rs.prev)}` : "")),
      m.sales ? k("Revenue", moneyK(m.rv.cur), delta(m.rv.cur, m.rv.prev), spark(c.series.revenue, m.rv.e)) : k("Meta / Google", `${Math.round(100 * meta / (m.sp.cur || 1))}/${Math.round(100 * goog / (m.sp.cur || 1))}`, "share of spend, %"),
    ];
    const ch = chan(c), chRow = (l, s, r, cl, rl) => s ? `<tr><td>${l}</td><td>${money(s)}</td><td>${num(r)} ${rl}</td><td>${r ? money(s / r) : "—"}</td><td>${num(cl)}</td></tr>` : "";
    return hero(h1, shortNote(c), kp) +
      `<div class="grid one">${card("Next steps", "Paid only.", stepsHTML(steps, name), `${steps.length}`)}</div>
       <div class="grid even">${card(`Spend ${per()}`, `Last ${span(c)} days. Shaded: the ${S.n} days above.`, areaChart(c, "spend", moneyK), "Windsor")}${card(m.sales ? `Sales ${per()}` : `Leads ${per()}`, "As reported by Meta and Google.", areaChart(c, m.sales ? "purchases" : "leads", num), "Windsor")}</div>
       <div class="grid one">${card("By channel", `${ch.label === "28 days" ? "Last 28 days" : `Last ${S.n} days`}. LSA and anything billed outside Windsor isn't included.`,
        `<div class="tw"><table><thead><tr><th>Channel</th><th>Spend</th><th>Results</th><th>Cost each</th><th>Clicks</th></tr></thead><tbody>${chRow("Meta", ch.meta.spend, ch.meta.leads, ch.meta.clicks, "leads")}${chRow("Google Ads", ch.google_ads.spend, ch.google_ads.conversions, ch.google_ads.clicks, "conversions")}</tbody></table></div>
        ${c.top_campaign ? `<p class="note">Biggest campaign: ${esc(c.top_campaign.name)}, ${money(c.top_campaign.spend)}.</p>` : ""}`)}</div>`;
  }
  function organicView(name, c, items) {
    if (!c) return hero(`No organic data for <em>${esc(name)}</em>.`, [], []);
    const steps = nextSteps(name, c, items).filter((s) => s.area === "organic"), g = windowOf(c, "gbp_actions");
    const h1 = sum(c.series.gbp_actions) ? `<em>${num(g.cur)}</em> Google profile actions through ${esc(fmtDay(toDate(g.end)))}.` : `No Google profile actions in <em>28 days</em>.`;
    const kp = ORG.map(([key, label]) => { const w = windowOf(c, key); return k(label, num(w.cur), delta(w.cur, w.prev), spark(c.series[key], w.e)); });
    const pf = profs(c);
    const prof = pf.list.length ? `<div class="grid one">${card("Google profiles", `${cap(pf.label)}. Each listing on its own row.`,
      `<div class="tw"><table><thead><tr><th>Profile</th><th>Calls</th><th>Directions</th><th>Website clicks</th><th>Views</th></tr></thead><tbody>${pf.list.map((p) => `<tr><td>${esc(p.label)}</td><td>${num(p.calls || 0)}</td><td>${num(p.directions || 0)}</td><td>${num(p.web_clicks || 0)}</td><td>${num(p.impressions || 0)}</td></tr>`).join("")}</tbody></table></div>`)}</div>` : "";
    return hero(h1, [...shortNote(c), ["info", "Each number covers the latest fully reported days. Google profile data arrives about 4 days late."]], kp) +
      `<div class="grid one">${card("Next steps", "Organic only.", stepsHTML(steps, name), `${steps.length}`)}</div>
       <div class="grid even">${card(`Google profile actions ${per()}`, "Calls, directions and website clicks. Dashed: not reported yet.", areaChart(c, "gbp_actions", num), "Windsor")}${card(`Search clicks ${per()}`, "Website results in Google, not the map listing.", areaChart(c, "sc_clicks", num), "Search Console")}</div>` + prof;
  }
  function crmView(name, c, items) {
    const g = c && c.crm, steps = nextSteps(name, c, items).filter((s) => s.area === "crm");
    if (!g) return hero(`GHL isn't connected for <em>${esc(name)}</em> here.`, [["info", "Add its GHL location and a view-only Private Integration token to the GHL_TOKENS secret. The daily run fills this tab."]], []) +
      `<div class="grid one">${card("Next steps", "CRM only.", stepsHTML(steps, name), `${steps.length}`)}</div>`;
    const days = g.window_days || 28;
    const kp = [k("New contacts", num(g.contacts), `last ${days} days`), k("Opportunities", num(g.opps_created), "created"), k("Marked won", num(g.opps_won || 0), g.opps_won_value ? money(g.opps_won_value) : ""), k("Appointments", num(g.appointments || 0), "in GHL")];
    const bars = c.windsor_leads_28d != null ? barsHTML([["Ad leads reported", c.windsor_leads_28d], ["New GHL contacts", g.contacts, true], ["Opportunities", g.opps_created], ["Marked won", g.opps_won || 0]]) : "";
    return hero(`<em>${num(g.contacts)}</em> new contacts, ${plural(g.opps_won || 0, "win", "wins")} marked in GHL.`, [], kp) +
      `<div class="grid one">${card("Next steps", "CRM only.", stepsHTML(steps, name), `${steps.length}`)}</div>` +
      (bars ? `<div class="grid one">${card("Ads vs GHL", `Last ${days} days. Booked and showed should come from ${esc((c.system && c.system.name) || "the client's own system")}, not GHL stages.`, bars, "GHL")}</div>` : "");
  }
  function aboutView() {
    const rules = [
      "Numbers come from Monday, Windsor ad and organic totals, and GHL counts. Nothing is written or scored by AI.",
      `Monday: only items with activity in the last ${S.recentDays} days. Older items are left out until someone touches them.`,
      `Stalled: Stuck, Reopened, Waiting or Contingent; a timeline end date that has passed; or in progress with no update in ${S.quietDays} days (${S.quietOngoing} for Ongoing).`,
      "Shipped: Monday's webhook records each status change to Done. Only those events count.",
      "Next steps: fixed rules. Each one appears only when its number crosses a line (for example, cost per lead up 50%), and says which number triggered it.",
      "Ads and organic: the latest fully reported days in the range (7, 14, 30 or 90) vs the same number of days before. Up to 186 days of daily history. Google profile data arrives about 4 days late. Trend only; LSA and anything billed outside Windsor isn't included.",
      "GHL: last 28 days of contacts, opportunities and appointments.",
    ];
    return hero(`How these numbers are <em>counted</em>.`, [], []) + `<div class="grid one">${card("Rules", "", `<ul class="rules">${rules.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`)}</div>`;
  }

  // ── routing + render ───────────────────────────────────────────────────
  let NAMES = [];
  function route() {
    const p = new URLSearchParams(location.hash.slice(1));
    let client = p.get("c"); const t = p.get("t");
    if (!client || !NAMES.includes(client)) { const last = localStorage.getItem(LAST_KEY); client = NAMES.includes(last) ? last : NAMES[0]; }
    return { client, tab: t === "about" || TABS.some(([x]) => x === t) ? t : "overview" };
  }
  const href = (client, tab) => `#c=${encodeURIComponent(client)}&t=${tab}`;
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  $("view").addEventListener("change", (e) => { location.hash = href(e.target.value, route().tab === "about" ? "overview" : route().tab).slice(1); });
  $("range").addEventListener("click", (e) => { const b = e.target.closest("button[data-n]"); if (b) { S.n = +b.dataset.n; render(); } });

  function render() {
    const payload = S.live || S.snapshot; if (!payload) return;
    const items = normalize(payload);
    NAMES = [...new Set([...items.map((i) => i.client), ...Object.keys((S.hub && S.hub.clients) || {})])]
      .filter((n) => n && n !== "Unassigned").sort((a, b) => (a === "Flow Company") - (b === "Flow Company") || a.localeCompare(b));
    const r = route(); localStorage.setItem(LAST_KEY, r.client);
    $("view").innerHTML = NAMES.map((n) => `<option value="${esc(n)}" ${r.client === n ? "selected" : ""}>${esc(n)}</option>`).join("");
    $("nav").innerHTML = TABS.map(([t, l]) => `<a href="${href(r.client, t)}" class="${r.tab === t ? "on" : ""}" ${r.tab === t ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24">${ICON[t]}</svg>${l}</a>`).join("") +
      `<div class="sep"></div><a href="daily.html"><svg viewBox="0 0 24 24">${ICON.drafts}</svg>Daily Ops drafts</a>`;
    $("crumb").innerHTML = `<b>${esc(r.tab === "about" ? "About these numbers" : TABS.find(([t]) => t === r.tab)[1])}</b> · ${esc(r.client)}`;
    $("range").innerHTML = [7, 14, 30, 90].map((n) => `<button type="button" data-n="${n}" class="${S.n === n ? "on" : ""}" aria-pressed="${S.n === n}">${n} days</button>`).join("");
    const c = hubClient(r.client);
    $("view-body").innerHTML = r.tab === "about" ? aboutView()
      : ({ overview: overviewView, paid: paidView, organic: organicView, crm: crmView }[r.tab])(r.client, c, items);
    renderFoot(r);
  }

  // ── rail footer ────────────────────────────────────────────────────────
  function renderFoot(r) {
    const snap = S.snapshot && S.snapshot.generated_at ? fmtTime(new Date(S.snapshot.generated_at)) : "unknown";
    const upd = S.live ? `Monday live, ${fmtTime(new Date(S.live.generated_at))}` : `Monday synced ${snap}`;
    const ads = S.ops && S.ops.through ? `. Ads through ${fmtDay(toDate(S.ops.through))}` : "";
    $("railfoot").innerHTML = `<a href="${href(r.client, "about")}">About these numbers</a>` +
      (S.live ? "" : `<br><button type="button" class="live" id="go-live">Read Monday live</button>`) +
      (S.askPass ? `<input id="pass" type="password" placeholder="Ops passcode" aria-label="Ops passcode">` : "") +
      (S.liveError ? `<span class="err">${esc(S.liveError)}</span>` : "") + `<div class="upd">${esc(upd + ads)}.</div>`;
    const btn = $("go-live");
    if (btn) btn.onclick = () => { if (localStorage.getItem(PASS_KEY) && !S.liveError) return loadLive(); S.askPass = true; renderFoot(route()); $("pass").focus(); };
    const input = $("pass");
    if (input) input.onkeydown = (e) => { if (e.key === "Enter" && input.value) { localStorage.setItem(PASS_KEY, input.value); S.askPass = false; S.liveError = ""; loadLive(); } };
  }
  async function loadLive() {
    const key = localStorage.getItem(PASS_KEY); if (!key) return;
    try {
      const res = await fetch("/.netlify/functions/ops-live", { headers: { "x-ops-key": key } });
      if (res.status === 401) { localStorage.removeItem(PASS_KEY); throw new Error("Passcode didn't match."); }
      if (!res.ok) throw new Error("Live read failed. Showing the morning sync.");
      S.live = await res.json(); S.liveError = "";
    } catch (err) { S.liveError = err.message; }
    render();
  }
  async function getJSON(path) { try { const r = await fetch(path, { cache: "no-store" }); return r.ok ? r.json() : null; } catch { return null; } }

  (async function init() {
    const [snap, ops, hub] = await Promise.all([getJSON("monday-items.json"), getJSON("ops.json"), getJSON("hub.json")]);
    S.snapshot = snap; S.ops = ops; S.hub = hub || { clients: {}, complete_through: {} };
    const set = (ops && ops.settings) || {};
    if (set.quiet_days) S.quietDays = set.quiet_days;
    if (set.quiet_days_ongoing) S.quietOngoing = set.quiet_days_ongoing;
    if (set.recent_days) S.recentDays = set.recent_days;
    if (!snap) { $("view-body").innerHTML = hero("Couldn't load <em>monday-items.json</em>.", [], []); return; }
    render();
    if (localStorage.getItem(PASS_KEY)) loadLive();
  })();
})();
</script>
</body>
</html>
