name: Draft Queue

# Ports the Cowork scheduled task `operations-dashboard-update` off Naz's laptop.
# Was: on-computer, daily 10:00 AM local, only ran when the Mac was awake.
# Now:  15:00 UTC = 10:00 Chicago (CDT) / 09:00 (CST), plus manual dispatch.

on:
  schedule:
    - cron: "0 15 * * *"

  # Lets the dashboard's "Refresh Everything" button reach this job.
  workflow_dispatch:

# No `contents: write` on purpose. This job writes to the `state` branch via the
# GitHub Contents API using GH_STATE_TOKEN, same path generate.py already uses.
# id-token: write is required by claude-code-action's authentication.
permissions:
  contents: read
  id-token: write

concurrency:
  # A second run overlapping the first would read a stale queue sha and clobber
  # the merge. Queue them instead.
  group: draft-queue
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the deterministic half before spending a model call
        run: python drafter/validate.py

      # Data access goes through the repo's existing fetchers (fetch_monday.py,
      # fetch_fireflies.py) via Bash -- they already handle auth, pagination, and
      # subitems, and generate.py has used them since July. No MCP config exists
      # in this repo, so no MCP tool names belong here.
      #
      # Read-only on Monday is a hard requirement from Naz. fetch_monday.py has
      # exactly one write function, set_monday_status_done() -- the drafter must
      # never call it. SKILL.md states this; the narrow allowlist backs it up.
      - name: Run the daily draft pass
        uses: anthropics/claude-code-action@v1
        env:
          MONDAY_API_TOKEN:  ${{ secrets.MONDAY_API_TOKEN }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          GH_STATE_TOKEN:    ${{ secrets.GH_STATE_TOKEN }}
          GH_REPO:           ${{ github.repository }}
          GH_BRANCH:         state
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Read drafter/SKILL.md and follow it end to end as your complete
            instructions for this run. It defines the jobs, the rules files to
            load, how to fetch data through the repo's existing fetchers, and
            how to write results to the state branch.
          claude_args: |
            --allowedTools "Bash,Read,Write"
            --max-turns 60

      - name: Surface the summary in the job log
        if: always()
        run: echo "Run summary is in the previous step's output."
