name: Draft Queue

# Ports the Cowork scheduled task `operations-dashboard-update` off Naz's laptop.
# Was: on-computer, daily 10:00 AM local, only ran when the Mac was awake.
# Now:  15:00 UTC = 10:00 Chicago (CDT) / 09:00 (CST), plus manual dispatch.

on:
  schedule:
    - cron: "0 15 * * *"

  # Lets the dashboard's "Refresh Everything" button reach this job.
  # See netlify/functions/refresh-everything.js -- add "draft-queue.yml" to its
  # dispatch list or the button keeps refreshing everything except this.
  workflow_dispatch:

# No `contents: write` here on purpose. This job writes to the `state` branch via
# the GitHub Contents API using GH_STATE_TOKEN, the same path generate.py already
# uses for standups/completed-accumulator.json. It never commits to main.
permissions:
  contents: read

concurrency:
  # A second run overlapping the first would read a stale queue sha and clobber
  # the merge. Queue them instead.
  group: draft-queue
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the deterministic half before spending a model call
        run: python drafter/validate.py

      # The drafting itself is judgment work -- relevance passes, prospect-vs-client
      # disambiguation, the priority rubric's "would delaying this quietly cause a
      # bigger problem later?" None of that is expressible as a script, which is why
      # this step runs Claude with drafter/SKILL.md as its prompt rather than
      # executing a Python reimplementation of it.
      - name: Run the daily draft pass
        uses: anthropics/claude-code-action@v1
        env:
          # Every one of these already exists as a repo secret -- standup.yml has
          # used them since July. Nothing new to provision.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONDAY_API_TOKEN:  ${{ secrets.MONDAY_API_TOKEN }}
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          GH_STATE_TOKEN:    ${{ secrets.GH_STATE_TOKEN }}
          GH_REPO:           ${{ github.repository }}
          GH_BRANCH:         state
        with:
          prompt_file: drafter/SKILL.md
          # Read-only on Monday. The skill's HARD RULE says so, but the rule is
          # only prose -- this is what actually enforces it. Do not add a Monday
          # write tool here without Naz saying so explicitly.
          allowed_tools: >-
            Bash,Read,Write,
            mcp__monday__get_board_items_page,
            mcp__monday__get_board_info,
            mcp__monday__get_type_details,
            mcp__fireflies__fireflies_get_transcripts,
            mcp__fireflies__fireflies_get_summary,
            mcp__fireflies__fireflies_get_transcript

      # The run summary is JOB B plus the push/state lines. It is chat-only by
      # design -- never pushed to the dashboard -- so the Actions log is where it
      # lives now that there's no Cowork thread to print it into.
      - name: Surface the summary in the job log
        if: always()
        run: echo "Run summary is in the previous step's output."
