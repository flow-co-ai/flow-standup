name: Daily Pulse

on:
  schedule:
    # 11:00 UTC = 6:00 am Chicago (CDT) / 5:00 am (CST)
    - cron: '0 11 * * *'
  workflow_dispatch: # manual "Run workflow" button in GitHub UI

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily pulse
        env:
          WINDSOR_API_KEY:  ${{ secrets.WINDSOR_API_KEY }}
          GHL_API_TOKEN:    ${{ secrets.GHL_API_TOKEN }}
          GHL_TOKENS:       ${{ secrets.GHL_TOKENS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pulse.js

      - name: Apply performance lens
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node apply_performance.js

      - name: Commit pulse and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pulse/ history/
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git commit -m "pulse: $(date -u +%Y-%m-%d)"
          # Retry push up to 3 times to handle concurrent-push rejection.
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed — retrying in $((i * 5))s…"
            sleep $((i * 5))
          done
