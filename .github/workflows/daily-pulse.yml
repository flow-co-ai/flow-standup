name: Daily Pulse

on:
  schedule:
    # 11:00 UTC = 6:00 am Chicago (CDT) / 5:00 am (CST)
    - cron: '0 11 * * *'
  workflow_dispatch: # manual "Run workflow" button in GitHub UI

permissions:
  contents: write

jobs:
  pulse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Sync playbooks from Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sync_playbooks.py

      - name: Extract timeline plans
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node extract_timeline.js

      - name: Write Monday snapshot
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python write_monday_snapshot.py

      - name: Apply task matching
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node apply_task_matching.js

      - name: Run daily pulse
        env:
          WINDSOR_API_KEY:  ${{ secrets.WINDSOR_API_KEY }}
          GHL_API_TOKEN:    ${{ secrets.GHL_API_TOKEN }}
          GHL_TOKENS:       ${{ secrets.GHL_TOKENS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node pulse.js

      - name: Apply ops-pulse brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node apply_ops_pulse.js

      - name: Build standup summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node build_standup_summary.js

      - name: Apply performance lens
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_PERFORMANCE: '1'
        run: node apply_performance.js

      - name: Apply reporter lens
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_REPORTER: '1'
        run: node apply_reporter.js

      - name: Build timeline
        env:
          STATE_BRANCH: state
        run: node build_timeline.js

      - name: Commit pulse and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pulse/ history/ reports/ playbooks/ timeline/ standups/
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
            exit 0
          fi
          git commit -m "pulse: $(date -u +%Y-%m-%d)"
          # Retry push up to 3 times to handle concurrent-push rejection.
          for i in 1 2 3; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed — retrying in $((i * 5))s…"
            sleep $((i * 5))
          done
